<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recursive Agents — Crusoe Hackathon</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2e3b;
    --text: #e8eaed;
    --muted: #9aa0a6;
    --accent: #8b5cf6;
    --accent-2: #22d3ee;
    --success: #34d399;
    --warning: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  h1 { font-size: 1.6rem; margin: 0; }
  h1 span { color: var(--accent); }
  .status-pill {
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    background: var(--surface);
    border: 1px solid var(--border);
  }
  .status-pill.running { border-color: var(--accent-2); color: var(--accent-2); }
  .status-pill.complete { border-color: var(--success); color: var(--success); }
  .goal-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
  }
  textarea {
    width: 100%;
    min-height: 80px;
    background: #12141c;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 12px;
    font-size: 1rem;
    resize: vertical;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    max-height: 420px;
    overflow-y: auto;
  }
  .card h2 { margin: 0 0 12px; font-size: 1rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .item {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.92rem;
  }
  .item:last-child { border-bottom: none; }
  .agent-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 600;
    margin-right: 6px;
    background: #2a2e3b;
  }
  .agent-tag.researcher { background: #1e3a5f; }
  .agent-tag.coder { background: #1e3f2e; }
  .agent-tag.tester { background: #3f2e1e; }
  .agent-tag.critic { background: #3f1e3a; }
  .empty { color: var(--muted); font-style: italic; }
  pre {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 0.85rem;
    margin: 6px 0 0;
    color: #c4c7ce;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Recursive <span>Agents</span></h1>
    <div id="status" class="status-pill">idle</div>
  </header>

  <div class="goal-box">
    <textarea id="goal" placeholder="Enter a high-level goal...&#10;Example: Research the top 3 approaches to recursive agents and write a short comparison"></textarea>
    <button id="startBtn" onclick="start()">Start Agents</button>
  </div>

  <div class="grid">
    <div class="card">
      <h2>Progress</h2>
      <div id="progress"><div class="empty">No activity yet</div></div>
    </div>
    <div class="card">
      <h2>Tasks</h2>
      <div id="tasks"><div class="empty">No tasks yet</div></div>
    </div>
  </div>

  <div class="card" style="margin-top:16px; max-height:500px;">
    <h2>Results</h2>
    <div id="results"><div class="empty">Waiting for agents...</div></div>
  </div>
</div>

<script>
let pollTimer = null;

async function start() {
  const goal = document.getElementById("goal").value.trim();
  if (!goal) return alert("Enter a goal first");
  document.getElementById("startBtn").disabled = true;
  await fetch("/api/start", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ goal })
  });
  startPolling();
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(refresh, 1500);
  refresh();
}

async function refresh() {
  const res = await fetch("/api/state");
  const data = await res.json();

  const statusEl = document.getElementById("status");
  statusEl.textContent = data.status || "idle";
  statusEl.className = "status-pill " + (data.status || "");

  // Progress
  const progressEl = document.getElementById("progress");
  if (data.progress && data.progress.length) {
    progressEl.innerHTML = data.progress.slice().reverse().map(p =>
      `<div class="item"><strong>${p.timestamp.slice(11,19)}</strong> — ${p.message}</div>`
    ).join("");
  } else {
    progressEl.innerHTML = `<div class="empty">No activity yet</div>`;
  }

  // Tasks
  const tasksEl = document.getElementById("tasks");
  if (data.tasks && data.tasks.length) {
    tasksEl.innerHTML = data.tasks.map(t =>
      `<div class="item"><span class="agent-tag ${t.agent}">${t.agent}</span>${t.task}<br><small style="color:var(--muted)">${t.status}</small></div>`
    ).join("");
  } else {
    tasksEl.innerHTML = `<div class="empty">No tasks yet</div>`;
  }

  // Results
  const resultsEl = document.getElementById("results");
  if (data.results && data.results.length) {
    resultsEl.innerHTML = data.results.slice().reverse().map(r =>
      `<div class="item"><span class="agent-tag ${r.agent}">${r.agent}</span>${r.task}<pre>${escapeHtml(r.output || "")}</pre></div>`
    ).join("");
  } else {
    resultsEl.innerHTML = `<div class="empty">Waiting for agents...</div>`;
  }

  if (data.status === "complete") {
    document.getElementById("startBtn").disabled = false;
    if (pollTimer) clearInterval(pollTimer);
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({ "&":"&","<":"<",">":">" }[c]));
}
</script>
</body>
</html>
