# agent: claude-code  2026-10-17
[project]
name = "rah"
version = "0.1.0"
description = "A self-improving agent team whose every change must prove itself on unseen tasks (Recursive Agents Hackathon)"
requires-python = ">=3.12"
dependencies = ["openai>=1.50", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rah"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
rah = "rah.cli:main"
